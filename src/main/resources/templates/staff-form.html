<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>スタッフ登録</title>
</head>
<body>
	<h1>店舗スタッフ管理システム</h1>
	<h2>スタッフ登録</h2>
	<p th:if="${errorMessage != null}"
		th:text="${errorMessage}">
	</p>
	<form action="/staff" method="post">
		<div>
			<label>名前：</label>
			<input type="text" name="name"
			required>
		</div>
		<div>
			<label>入社日：</label>
			<input type="date" name="joinDate"
			required>
		</div>
		<div>
			<button type="submit">登録</button>
		</div>
	</form>
		<div>
			<a href="/staff">スタッフ一覧へ戻る</a>
		</div>
</body>
</html>
