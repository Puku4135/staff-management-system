<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>教育項目一覧</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div class="app-layout">

    <aside class="sidebar">

        <div class="sidebar-title">
            店舗スタッフ管理
        </div>

        <nav class="sidebar-menu">

            <a href="/staff"
               class="sidebar-link">
                スタッフ一覧
            </a>

            <a href="/skills"
               class="sidebar-link active">
                教育項目
            </a>

        </nav>

    </aside>


    <div class="main-area">

        <header class="topbar">

            <div class="topbar-title">
                店舗スタッフ管理システム
            </div>

            <div class="topbar-user">
                管理者
            </div>

        </header>


        <main class="content">

            <div class="page-heading">

                <h1>教育項目管理</h1>

                <p>
                    新人教育で使用する教育項目を管理します。
                </p>

            </div>


            <section class="panel">

                <div class="panel-title">
                    教育項目検索
                </div>


                <form action="/skills"
                      method="get"
                      class="search-form">

                    <div class="form-group">

                        <label for="category">
                            カテゴリ
                        </label>

                        <select id="category"
                                name="category">

                            <option value="all"
                                    th:selected="${selectedCategory == null
                                        || selectedCategory == ''
                                        || selectedCategory == 'all'}">
                                すべて
                            </option>

                            <option value="接客"
                                    th:selected="${selectedCategory == '接客'}">
                                接客
                            </option>

                            <option value="調理"
                                    th:selected="${selectedCategory == '調理'}">
                                調理
                            </option>

                            <option value="清掃"
                                    th:selected="${selectedCategory == '清掃'}">
                                清掃
                            </option>

                            <option value="店舗運営"
                                    th:selected="${selectedCategory == '店舗運営'}">
                                店舗運営
                            </option>

                            <option value="その他"
                                    th:selected="${selectedCategory == 'その他'}">
                                その他
                            </option>

                        </select>

                    </div>


                    <button type="submit"
                            class="button button-primary">
                        絞り込み
                    </button>


                    <a href="/skills"
                       class="button button-secondary">
                        クリア
                    </a>

                </form>

            </section>


            <section class="panel">

                <div class="section-header">

                    <h2>教育項目一覧</h2>

                    <button type="button"
                            class="button button-primary"
                            onclick="showAddForm()">
                        ＋ 教育項目を追加
                    </button>

                </div>


                <div th:if="${errorMessage != null}"
                     class="error-message"
                     th:text="${errorMessage}">
                </div>


                <form id="addForm"
                      action="/skills"
                      method="post"
                      class="inline-add-form"
                      style="display:none;">


                    <div class="form-row">


                        <div class="form-group">

                            <label for="name">
                                教育項目名
                            </label>

                            <input type="text"
                                   id="name"
                                   name="name"
                                   placeholder="例：レジ操作"
                                   required>

                        </div>


                        <div class="form-group">

                            <label for="addCategory">
                                カテゴリ
                            </label>

                            <select id="addCategory"
                                    name="category">

                                <option value="接客">接客</option>
                                <option value="調理">調理</option>
                                <option value="清掃">清掃</option>
                                <option value="店舗運営">店舗運営</option>
                                <option value="その他">その他</option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="estimatedDays">
                                習得目安（日）
                            </label>

                            <input type="number"
                                   id="estimatedDays"
                                   name="estimatedDays"
                                   min="1"
                                   class="small-input"
                                   required>

                        </div>


                        <button type="submit"
                                class="button button-primary">
                            登録する
                        </button>


                        <button type="button"
                                class="button button-secondary"
                                onclick="hideAddForm()">
                            キャンセル
                        </button>

                    </div>

                </form>


                <div class="table-wrapper">

                    <table>

                        <thead>

                        <tr>
                            <th>No.</th>
                            <th>教育項目</th>
                            <th>カテゴリ</th>
                            <th>習得目安</th>
                            <th>操作</th>
                        </tr>

                        </thead>


                        <tbody>

                        <tr th:each="skill, stat : ${skillList}">

                            <td th:text="${stat.count}">
                                1
                            </td>


                            <td th:text="${skill.name}">
                                レジ操作
                            </td>


                            <td>

                                <span class="category-badge"
                                      th:text="${skill.category}">
                                    接客
                                </span>

                            </td>


                            <td>

                                <span class="estimated-days">

                                    <span th:text="${skill.estimatedDays}">
                                        7
                                    </span>

                                    日

                                </span>

                            </td>


                            <td>

                                <div class="actions">

                                    <a th:href="@{/skills/edit/{id}(id=${skill.id})}"
                                       class="button button-secondary">
                                        編集
                                    </a>


                                    <form th:action="@{/skills/delete/{id}(id=${skill.id})}"
                                          method="post"
                                          onsubmit="return confirm('この教育項目を削除しますか？');">

                                        <button type="submit"
                                                class="button button-danger">
                                            削除
                                        </button>

                                    </form>

                                </div>

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>

</div>


<script>

    function showAddForm() {
        document.getElementById("addForm").style.display = "block";
    }

    function hideAddForm() {
        document.getElementById("addForm").style.display = "none";
    }

</script>

</body>
</html>
