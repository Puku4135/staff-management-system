<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>教育項目一覧</title>
</head>

<body>
	<h1>店舗スタッフ管理システム</h1>
	<h2>教育項目一覧</h2>
	<a href="/staff">スタッフ一覧へ戻る</a>
	
	<p th:if="${errorMessage != null}"
		th:text="${errorMessage}">
	</p>
	
	<button type="button" onclick="showAddForm()">＋ 教育項目を追加</button>
	
	<form id="addForm"
			action="/skills"
			method="post"
			style="display:none;">
	
		<div>
			<label>教育項目</label>
			<input type="text"
					name="name"
					required>
		</div>
		
		<div>
			<label>カテゴリ：</label>
			
			<select name="category">
				<option value="接客">接客</option>
				<option value="調理">調理</option>
				<option value="清掃">清掃</option>
				<option value="店舗運営">店舗運営</option>
				<option value="その他">その他</option>
			</select>
		</div>
		
		<div>
			<label>習得目安</label>
			<input type="number"
					name="estimatedDays"
					min="1"
					required>
			日
		</div>
		
		<div>
			<button type="submit">追加</button>
			<button type="button" onclick="hideAddForm()">キャンセル</button>
		</div>
	</form>
	
	<table border="1">
		
		<tr>
			<th>No.</th>
			<th>教育項目</th>
			<th>カテゴリ</th>
			<th>習得目安</th>
			<th>操作</th>
		</tr>
		
		<tr th:each="skill, stat : ${skillList}">
			<td th:text="${stat.count}"></td>
			<td th:text="${skill.name}"></td>
			<td th:text="${skill.category}"></td>
			<td>
				<span th:text="${skill.estimatedDays}"></span>日
			</td>
			<td>
				<a th:href="@{/skills/edit/{id}(id=${skill.id})}">
					編集
				</a>
				<form th:action="@{/skills/delete/{id}(id=${skill.id})}"
						method="post"
						style="display:inline;">
					<button type="submit">
						削除
					</button>
				</form>
			</td>
		</tr>
		
	</table>
	
	<script>
		function showAddForm() {
			document.getElementById("addForm").style.display = "block";
		}
		function hideAddForm() {
			document.getElementById("addForm").style.display = "none";
		}
	</script>
</body>
</html>
