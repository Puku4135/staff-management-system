<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	
<head>
	<meta charset="UTF-8">
	<title>教育状況</title>
</head>
<body>
	<h1>店舗スタッフ管理システム</h1>
	<h2>教育状況</h2>
	<div>
		<p>
			スタッフ名：
			<span th:text="${staff.name}"></span>
			</p>
			
		<p>
			入社日：
			<span th:text="${staff.joinDate}"></span>
		</p>
	</div>
	<h3>教育進捗</h3>
	
	<table border="1">
		<tr>
			<th>教育項目</th>
			<th>カテゴリ</th>
			<th>習得度</th>
			<th>習得目安</th>
			<th>教育担当者</th>
			<th>備考</th>
			<th>操作</th>
		</tr>
		
		<tr th:each="skill : ${skillList}">
			<form th:action="@{/staff/training/{staffId}/skill/{skillId}
				(staffId=${staff.id}, skillId=${skill.id})}"
				method="post">
				
				<td th:text="${skill.name}"></td>
				<td th:text="${skill.category}"></td>
				<td>
					<select name="status">
						<option value="NOT_STARTED"
								th:selected="${statusMap[skill.id] == 'NOT_STARTED'}">
							未習得
						</option>
						<option value="IN_PROGRESS"
								th:selected="${statusMap[skill.id] == 'IN_PROGRESS'}">
							練習中
						</option>
						<option value="COMPLETED"
								th:selected="${statusMap[skill.id] == 'COMPLETED'}">
							習得済み
						</option>
					</select>
				</td>
				<td>
					<spam th:text="${skill.estimatedDays}"></spam>日
				</td>
				<td>
					<input type="text"
						   name="trainerName"
						   th:value="${progressMap[skill.id] != null
								? progressMap[skill.id].trainerName
								: ''}">
				</td>
				<td>
					<input type="text"
						   name="memo"
						   th:value="${progressMap[skill.id] != null
								? progressMap[skill.id].memo
								: ''}">
				</td>
				<td>
					<button type="submit">
						保存
					</button>
				</td>
			</form>
		</tr>
	</table>
	<div>
		<a href="/staff">スタッフ一覧へ戻る</a>
	</div>
</body>
</html>
