<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>スタッフ一覧</title>
</head>
<body>

    <h1>店舗スタッフ管理システム</h1>
    <h2>スタッフ一覧</h2>
	
	<form action="/staff" method="get">
		<label>スタッフ検索：</label>
		<input type="text"
			name="keyword"
			th:value="${keyword}">
		<button type="submit">
			検索
		</button>
		
		<a href="/staff">
			クリア
		</a>
	</form>
	
	<a href="/skills">教育項目一覧へ</ahref>
	
	<a href="/staff/new">スタッフを登録する</a>
	
	<table border="1">
		
		<tr>
			<th>No.</th>
			<th>名前</th>
			<th>入社日</th>
			<th>操作</th>
		</tr>
		
		<tr th:each="staff, stat : ${staffList}">
			<td th:text="${stat.count}"></td>
			<td th:text="${staff.name}"></td>
			<td th:text="${staff.joinDate}"></td>
			<td>
				<a th:href="@{/staff/training/{id}(id=${staff.id})}">
					教育状況
				</a>
				<a th:href="@{/staff/edit/{id}(id=${staff.id})}">
					編集
				</a>
				<form th:action="@{/staff/delete/{id}(id=${staff.id})}"
					method="post"
					style="display:inline;">
					<button type="submit">削除</button>
				</form>
			</td>
		</tr>
	</table>

</body>
</html>
